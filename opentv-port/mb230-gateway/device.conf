# Open TV device description - Vestel 17MB230 (Horizon/Medion MB230)
# NOTE: this parser treats inline comments as part of the value;
# keep comments on their own lines only.

[device]
name = mb230-vestel
board = vestel/17mb230

[display]
backend = dfb

[input]
backend = uart

[audio]
backend = null

[network]
backend = mock

[storage]
internal = /buffer/opentv-port/media
external = /buffer/opentv-port/usb
