# Open TV device description — Vestel 17MB230 (Horizon/Medion MB230)
# The launcher reads this at startup (OTV_DEVICE_CONF or /etc/otv/device.conf).

[device]
name = mb230-vestel
board = vestel/17mb230

[display]
backend = dfb          ; DirectFB sawman sidecar window (no DRM/KMS on MB230)

[input]
backend = uart         ; UART-IR via the mempatch IPC socket (no evdev)

[audio]
backend = null         ; audio muted until the ALSA backend lands

[network]
backend = mock         ; simulated online state

[storage]
internal = /buffer/otv-media        ; Video app media dir
external = /buffer/otv-usb        ; USB media dir
